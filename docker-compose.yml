# English Coach on your own Docker host.
#   1. cp .env.example .env   and set APP_PASSWORD
#   2. docker compose up -d --build
#   3. point the reverse proxy to 127.0.0.1:8080 (see DOCKER.md)
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_USER: ${APP_USER:-bj}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY in .env}
      TTS_URL: http://tts:5000
      # Only needed for the chat tutor on "/". The /learn pages and /progress work without it.
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    depends_on:
      - tts
  tts:
    build: ./tts
    restart: unless-stopped
    expose:
      - "5000"
